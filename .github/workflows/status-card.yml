# Redraws the status card from status.okoro.me every 30 minutes and publishes the
# two SVGs to the `status-card` branch (force-pushed, so it stays one commit and main stays clean).
name: Status card

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/status-card.mjs
      - .github/workflows/status-card.yml

permissions:
  contents: write

concurrency:
  group: status-card
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw the card
        run: node scripts/status-card.mjs --base https://status.okoro.me --slug osiris --out out
        env:
          # Optional repo variable, e.g. "cinelog.okoro.me" to hide a monitor from the card
          EXCLUDE: ${{ vars.STATUS_EXCLUDE }}

      - name: Publish to the status-card branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b status-card
          git config user.name "dan-od"
          git config user.email "144839443+dan-od@users.noreply.github.com"
          git add status-light.svg status-dark.svg
          git commit -qm "Update status card"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-card
